services:
  app:
    build: ./server
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://spotistats:devpassword@postgres:5432/spotistats
    depends_on:
      - postgres
      - redis
  
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=spotistats
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=spotistats
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    
volumes:
  pgdata:
  